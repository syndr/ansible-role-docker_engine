---
role_name_check: 0
dependency:
  name: galaxy
driver:
  name: default
  options:
    managed: true
    login_cmd_template: 'docker exec -ti {instance} bash'
platforms:
  - name: role-docker_engine-docker-rockylinux9
    type: docker
    image: geerlingguy/docker-rockylinux9-ansible:latest
    systemd: True
    modify_image: False
    privileged: True
    hostvars:
      ci_docker_low_version: "20.10"
      ci_docker_high_version: "25.0"

  - name: role-docker_engine-docker-fedora42
    type: docker
    image: geerlingguy/docker-fedora42-ansible:latest
    systemd: True
    modify_image: False
    privileged: True
    hostvars:
      ci_docker_low_version: "28.2"
      ci_docker_high_version: "28.4"

  - name: role-docker_engine-docker-amazon2023
    type: docker
    image: geerlingguy/docker-amazonlinux2023-ansible:latest
    systemd: True
    modify_image: False
    privileged: True
    hostvars:
      ci_docker_low_version: "20.10"
      ci_docker_high_version: "24.0"

  - name: role-docker_engine-ubuntu2404
    type: docker
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    systemd: True
    modify_image: False
    privileged: True
    hostvars:
      ci_docker_low_version: "27.2"
      ci_docker_high_version: "27.4"
provisioner:
  name: ansible
  log: True
  playbooks:
    create: ../resources/create.yml
    prepare: ../resources/prepare.yml
    converge: ../resources/converge.yml
    side_effect: ../resources/side_effect.yml
    verify: ../resources/verify.yml
    cleanup: ../resources/cleanup.yml
    destroy: ../resources/destroy.yml
  config_options:
    defaults:
      gathering: explicit
      playbook_vars_root: top
      verbosity: ${ANSIBLE_VERBOSITY:-0}
  env:
    ANSIBLE_ROLES_PATH: /usr/share/ansible/roles:/etc/ansible/roles:${MOLECULE_PROJECT_DIRECTORY}/.ansible/roles:${HOME}/.ansible/roles
    ANSIBLE_COLLECTIONS_PATH: /usr/share/ansible/collections:${MOLECULE_PROJECT_DIRECTORY}/.ansible/collections:${HOME}/.ansible/collections

    ARA_API_CLIENT: ${ARA_API_CLIENT:-'http'}
    ARA_API_SERVER: ${ARA_API_SERVER:-'http://localhost:8000'}
    ARA_DEFAULT_LABELS: ${ARA_DEFAULT_LABELS:-'testing,molecule'}
    # To use Ara with molecule:
    #  export the ANSIBLE_CALLBACK_PLUGINS env var with the output of 'python3 -m ara.setup.callback_plugins'
    ANSIBLE_CALLBACK_PLUGINS: ${ANSIBLE_CALLBACK_PLUGINS}
scenario:
  create_sequence:
    - dependency
    - create
    - prepare
  check_sequence:
    - dependency
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - check
    - destroy
  converge_sequence:
    - dependency
    - create
    - prepare
    - converge
  destroy_sequence:
    - dependency
    - cleanup
    - destroy
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
  enabled: true

