---

- name: Prepare controller for execution
  hosts: localhost
  tags: always
  tasks:
    - name: Configure for standalone role testing
      ansible.builtin.include_role:
        name: syndr.molecule.prepare_controller
      vars:
        prepare_controller_project_type: role

- name: Prepare target host for execution
  hosts: molecule
  tags: always
  tasks:
    - name: Load OS compatibility settings
      ansible.builtin.include_tasks: tasks/os_compat.yml

    - name: Create ansible service account
      vars:
        molecule_user: molecule_runner
      become: true
      block:
        - name: Create ansible group
          ansible.builtin.group:
            name: "{{ molecule_user }}"

        - name: Create ansible user
          ansible.builtin.user:
            name: "{{ molecule_user }}"
            group: "{{ molecule_user }}"

        - name: Sudoers.d directory exists
          ansible.builtin.file:
            path: /etc/sudoers.d
            state: directory
            owner: root
            group: root
            mode: 0751

        - name: Ansible user has sudo
          ansible.builtin.copy:
            content: |
              {{ molecule_user }}  ALL=(ALL)  NOPASSWD: ALL
            dest: /etc/sudoers.d/ansible
            owner: root
            group: root
            mode: 0600

    - name: Set up legacy system packages
      when: >
        ansible_distribution == "Amazon" and ansible_distribution_major_version == "2" or
        ansible_distribution == "CentOS" and ansible_distribution_major_version == "7"
      block:
        - name: Do package manager actions
          become: true
          block:
            - name: Install Cent7 specific packages
              when: ansible_distribution == "CentOS"
              ansible.builtin.yum:
                name:
                  - epel-release
                state: present

            - name: Install package prequisites
              ansible.builtin.package:
                name:
                  - tar
                  - curl
                  - bzip2
                state: present

            - name: Install troubleshooting packages
              ansible.builtin.package:
                name:
                  - jq
                  - vim
                  - bind-utils
                state: present

    - name: Install package prequisites (RHEL)
      when:
        - ansible_os_family == "RedHat"
        - not (ansible_distribution == "Amazon" and ansible_distribution_major_version == "2")
      become: true
      ansible.builtin.package:
        name:
          - python3
          - python3-pip
          - nftables  # These are the userland tools for nftables
        state: present

    - name: Python requests library is installed
      become: true
      ansible.builtin.pip:
        # Requests 2.32.0 has a docker incompatibility
        name: requests>2.32.0
        state: present

